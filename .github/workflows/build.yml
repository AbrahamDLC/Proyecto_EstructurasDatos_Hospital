name: 'Compilar Clínica Multiplataforma'

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      # 1. Clonar el repositorio
      - uses: actions/checkout@v4

      # 2. Instalar dependencias de sistema (solo Linux)
      - name: Instalar dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 3. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: ./clinica-frontend/package-lock.json

      # 4. Configurar Rust
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 5. Caché de Rust para acelerar compilaciones
      - name: Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './clinica-frontend/src-tauri -> target'

      # 6. COMPILAR EL BACKEND EN C (Depende de la plataforma)
      - name: Compilar Backend C (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cc -dynamiclib -fPIC -O2 -Iinclude/Structs \
              src/ffi_facade.c src/pacientes.c src/doctor.c src/especialidades.c src/cita.c \
              src/arbol.c src/arbolPacientes.c src/arbolDoctor.c \
              src/pila.c src/cola.c src/validaciones.c src/fecha.c src/login.c \
              -o clinica-frontend/src-tauri/libclinica.dylib

      - name: Compilar Backend C (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          gcc -shared -fPIC -O2 -Iinclude/Structs \
              src/ffi_facade.c src/pacientes.c src/doctor.c src/especialidades.c src/cita.c \
              src/arbol.c src/arbolPacientes.c src/arbolDoctor.c \
              src/pila.c src/cola.c src/validaciones.c src/fecha.c src/login.c \
              -o clinica-frontend/src-tauri/libclinica.so

      - name: Compilar Backend C (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          gcc -shared -fPIC -O2 -Iinclude/Structs `
              src/ffi_facade.c src/pacientes.c src/doctor.c src/especialidades.c src/cita.c `
              src/arbol.c src/arbolPacientes.c src/arbolDoctor.c `
              src/pila.c src/cola.c src/validaciones.c src/fecha.c src/login.c `
              -o clinica-frontend/src-tauri/libclinica.dll

      # 7. Instalar dependencias del frontend
      - name: Instalar dependencias de Node
        run: |
          cd clinica-frontend
          npm ci

      # 8. Construir y empaquetar con Tauri
      - name: Construir App con Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './clinica-frontend'
          tagName: app-v__VERSION__
          releaseName: 'Clínica v__VERSION__'
          releaseBody: 'Descarga los ejecutables para tu sistema operativo.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}